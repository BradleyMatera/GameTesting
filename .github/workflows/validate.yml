name: Validate interactive lab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find js tests -type f \( -name '*.js' -o -name '*.mjs' \) | sort)

      - name: Validate page structure and registry
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          root = Path('.')
          html = (root / 'index.html').read_text(encoding='utf-8')
          registry = (root / 'js/demo-registry.js').read_text(encoding='utf-8')

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.local_files = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      if attrs['id'] in self.ids:
                          raise AssertionError(f"Duplicate id: {attrs['id']}")
                      self.ids.add(attrs['id'])
                  if tag == 'script' and attrs.get('src', '').startswith('./'):
                      self.local_files.append(attrs['src'][2:])
                  if tag == 'link' and attrs.get('href', '').startswith('./'):
                      self.local_files.append(attrs['href'][2:])

          parser = Parser()
          parser.feed(html)

          required_ids = {
              'renderCanvas', 'demo-stage', 'demo-library', 'demo-nav',
              'category-nav', 'demo-search', 'demo-title', 'demo-description',
              'tour-toggle', 'reset-view', 'previous-demo', 'next-demo',
              'engine-mode', 'fps-counter', 'mesh-counter', 'loading-screen',
              'error-screen'
          }
          missing = sorted(required_ids - parser.ids)
          if missing:
              raise AssertionError(f"Missing required ids: {missing}")

          missing_files = [name for name in parser.local_files if not (root / name).exists()]
          if missing_files:
              raise AssertionError(f"Missing linked files: {missing_files}")

          demo_ids = re.findall(r'\bdemo\(\s*"([^"]+)"', registry)
          if len(demo_ids) != 25:
              raise AssertionError(f"Expected 25 demos, found {len(demo_ids)}")
          if len(set(demo_ids)) != len(demo_ids):
              raise AssertionError('Demo ids must be unique')

          imports = re.findall(r'from\s+"(\./[^"]+)"', registry)
          for module_path in imports:
              resolved = (root / 'js' / module_path).resolve()
              if not resolved.exists():
                  raise AssertionError(f"Missing registry module: {module_path}")

          print(f"Validated {len(parser.ids)} HTML ids, {len(parser.local_files)} local assets, and {len(demo_ids)} demos.")

      - name: Smoke-test static server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/game-testing-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:8080/ > /tmp/index.html
          grep -q "Interactive Systems Lab" /tmp/index.html
          curl --fail --silent --show-error http://127.0.0.1:8080/js/demo-registry.js > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/lab-expansion.css > /dev/null

  browser-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Open all demos in a real browser
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/game-testing-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 1
          node tests/browser-smoke.mjs
