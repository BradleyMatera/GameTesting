name: Apply production release

on:
  push:
    branches: [main]
    paths:
      - ".release-payload/**"
      - ".github/workflows/apply-production-release.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-production-release
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'pull_request' || github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct verified production tree
        shell: bash
        run: |
          set -euo pipefail
          echo "Release payload inventory:"
          find .release-payload -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          chunks=()
          missing=0
          for number in $(seq 0 16); do
            chunk=$(printf '.release-payload/chunk-%03d' "$number")
            if [[ ! -s "$chunk" ]]; then
              echo "MISSING: $chunk"
              missing=1
            else
              chunks+=("$chunk")
            fi
          done
          [[ "$missing" -eq 0 ]]
          cat "${chunks[@]}" | tr -d '\r\n\t ' > /tmp/release.tar.gz.b64
          base64 -d /tmp/release.tar.gz.b64 > /tmp/release.tar.gz
          echo "ee7ecfb68b3a9b7cd675b8f40111e7821663c0a39a5d855c8c14816365c93555  /tmp/release.tar.gz" | sha256sum -c -
          rm -rf /tmp/production-release
          mkdir -p /tmp/production-release
          tar -xzf /tmp/release.tar.gz -C /tmp/production-release
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/production-release/. .
          rm -rf .release-payload
          rm -f .github/workflows/apply-production-release.yml

      - name: Commit production release to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "release: rebuild lab as production 3D showcase"
          git push origin HEAD:main
