name: Apply production release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-production-release
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct verified production tree
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\r\n\t ' < .production-v3.tar.gz.b64 > /tmp/production-v3.tar.gz.b64
          echo "8aa01128693deaf136bf4fbd800a797b97d5b66e2000cfda83e7d200952e5a46  /tmp/production-v3.tar.gz.b64" | sha256sum -c -
          base64 -d /tmp/production-v3.tar.gz.b64 > /tmp/production-v3.tar.gz
          echo "7215da8a043e9a044a6874d9182d344863a1040794639e09beb8dfc25a83d979  /tmp/production-v3.tar.gz" | sha256sum -c -
          rm -rf /tmp/production-v3
          mkdir -p /tmp/production-v3
          tar -xzf /tmp/production-v3.tar.gz -C /tmp/production-v3
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/production-v3/. .

      - name: Commit production source tree to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "release: ship production interactive systems lab"
          git push origin HEAD:main
