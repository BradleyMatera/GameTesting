name: Apply purpose-built demo overhaul

on:
  push:
    branches: [agent/unique-demo-overhaul]
    paths:
      - ".v2-payload2/**"
      - ".github/workflows/apply-v2.yml"
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout overhaul branch
        uses: actions/checkout@v4
        with:
          ref: agent/unique-demo-overhaul
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct production source
        shell: python
        run: |
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import shutil

          payload = Path('.v2-payload2')
          mapping = {
              'system-simulations.js': (Path('js/demos/system-simulations.js'), '87cacf31fb8d78e7de068a0c028ba31ab2f8f68e1069eeff65fd8020f067ebbc'),
              'interactive-tools.js': (Path('js/demos/interactive-tools.js'), 'a1ea7ccdacd6e77a2fc08780d2f7e5c722f70045d9842c9ddd8293d35fc02277'),
              'browser-games.js': (Path('js/demos/browser-games.js'), 'f0ca3c80386d004e7bb5e7975538ec1ca25f1092b22f6eab0658efd76ce3433e'),
              'production-v2.css': (Path('production-v2.css'), '6d19409aa5ed579cb5ef3dad0424d48cb4473014c1f0b4518c71aad29fd81a65'),
          }

          for stem, (destination, expected_sha) in mapping.items():
              chunks = sorted(payload.glob(f'{stem}.*.b64'))
              if not chunks:
                  raise SystemExit(f'Missing payload chunks for {stem}')
              texts = []
              for chunk in chunks:
                  text = chunk.read_text(encoding='utf-8').strip()
                  print(f'Chunk {chunk.name}: chars={len(text)}, sha256={hashlib.sha256(text.encode()).hexdigest()}')
                  texts.append(text)
              encoded = ''.join(texts)
              generated = gzip.decompress(base64.b64decode(encoded, validate=True))
              actual_sha = hashlib.sha256(generated).hexdigest()
              if actual_sha != expected_sha:
                  raise SystemExit(f'Checksum mismatch for {stem}: {actual_sha}')
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(generated)
              print(f'Generated {destination} ({len(generated)} bytes, sha256={actual_sha})')

          for temporary in [Path('.v2-payload'), Path('.v2-payload2')]:
              if temporary.exists():
                  shutil.rmtree(temporary)
          Path('.github/workflows/apply-v2.yml').unlink()

      - name: Validate generated source
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          node --check js/demos/system-simulations.js
          node --check js/demos/interactive-tools.js
          node --check js/demos/browser-games.js
          test -s production-v2.css
          test "$(wc -c < production-v2.css)" -gt 50000
          grep -q "agent-office-floor" js/demos/system-simulations.js
          grep -q "arch-graph" js/demos/interactive-tools.js
          grep -q "defense-tower" js/demos/browser-games.js

      - name: Commit generated overhaul
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply purpose-built demo overhaul"
          git push origin HEAD:agent/unique-demo-overhaul
