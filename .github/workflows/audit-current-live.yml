name: Remove temporary visual audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-current-live.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary audit files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf audit-screenshots
          rm -f .github/workflows/audit-current-live.yml
          git add -A
          git commit -m "Remove temporary visual audit files"
          git push origin HEAD:main
