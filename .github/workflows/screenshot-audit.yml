name: Capture visual audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture all demos and internal states
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/game-testing-audit-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 1
          node tests/capture-visual-audit.mjs

      - name: Upload screenshot audit
        uses: actions/upload-artifact@v4
        with:
          name: game-testing-visual-audit
          path: audit-screenshots
          if-no-files-found: error
          retention-days: 7
