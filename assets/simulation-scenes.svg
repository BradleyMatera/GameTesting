      <g transform="translate(700 360)"><circle r="46" fill="#0b2a20" stroke="#34d399" stroke-width="5"/><text y="9" fill="#fff" font-size="28" font-weight="700">◎</text><text y="84" fill="#cbd5e1" font-size="18">REVIEW</text></g>
      <g transform="translate(840 360)"><circle r="46" fill="#0b2a20" stroke="#34d399" stroke-width="5"/><text y="9" fill="#fff" font-size="28" font-weight="700">S</text><text y="84" fill="#cbd5e1" font-size="18">STAGING</text></g>
