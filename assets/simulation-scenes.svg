    <g fill="#dbeafe" font-family="Arial" font-size="22" font-weight="700" letter-spacing="3">
      <text x="290" y="405">RESEARCH</text><text x="545" y="263">BUILD</text><text x="780" y="400">DELIVERY</text><text x="510" y="546">REVIEW</text>
