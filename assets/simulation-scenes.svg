      <g fill="#fff" opacity=".9"><circle cx="352" cy="355" r="5"/><circle cx="368" cy="355" r="5"/><circle cx="542" cy="287" r="5"/><circle cx="558" cy="287" r="5"/><circle cx="762" cy="365" r="5"/><circle cx="778" cy="365" r="5"/><circle cx="557" cy="473" r="5"/><circle cx="573" cy="473" r="5"/></g>
