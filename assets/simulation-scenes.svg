    <g fill="none" stroke="#fff" stroke-opacity=".24" stroke-width="4" stroke-dasharray="12 12"><path d="M390 352C450 320 480 300 520 298"/><path d="M580 308c65 15 110 36 160 58"/><path d="M758 402c-45 45-95 68-160 73"/></g>
